# Test profile. Datasource and Redis are injected by Testcontainers
# (see AbstractIntegrationTest). Optional integrations stay unconfigured so
# the suite proves the app runs without Gmail or an LLM key.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  demo-enabled: true
  # Tests seed explicitly so counts stay deterministic and start-up stays fast.
  demo-seed-on-startup: false
  google:
    client-id: ""
    client-secret: ""
  llm:
    api-key: ""

logging:
  level:
    org.testcontainers: WARN
    com.github.dockerjava: WARN
