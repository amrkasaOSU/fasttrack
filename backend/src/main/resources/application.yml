# =====================================================================
# FastTrack backend configuration.
#
# Every value can be overridden by an environment variable (see
# .env.example at the repository root). The defaults below are the
# docker-compose / local-development values.
# =====================================================================
spring:
  application:
    name: fasttrack

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fasttrack}
    username: ${SPRING_DATASOURCE_USERNAME:fasttrack}
    password: ${SPRING_DATASOURCE_PASSWORD:fasttrack_local_dev_only}
    hikari:
      maximum-pool-size: 10
      pool-name: fasttrack-pool

  jpa:
    hibernate:
      # The schema belongs to Flyway. `validate` fails fast if an entity and
      # the migrations disagree - see DECISIONS.md D-006.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 3s

  session:
    timeout: 7d
    redis:
      namespace: fasttrack:session
      repository-type: default

  servlet:
    multipart:
      # Resume uploads are capped at 2 MB by the controller as well.
      max-file-size: 2MB
      max-request-size: 3MB

  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        name: FASTTRACK_SESSION
        http-only: true
        same-site: lax
        secure: ${APP_SECURE_COOKIES:false}
  error:
    include-message: never
    include-stacktrace: never

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  backend-url: ${APP_BACKEND_URL:http://localhost:8080}
  secure-cookies: ${APP_SECURE_COOKIES:false}
  demo-enabled: ${APP_DEMO_ENABLED:true}
  token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  llm:
    base-url: ${OPENAI_BASE_URL:https://api.groq.com/openai/v1}
    api-key: ${OPENAI_API_KEY:}
    model: ${LLM_MODEL:llama-3.3-70b-versatile}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:30}
    max-retries: ${LLM_MAX_RETRIES:1}
    cache-ttl-days: 30
  sync:
    initial-days: ${APP_SYNC_INITIAL_DAYS:120}
    cron: ${APP_SYNC_CRON:0 */15 * * * *}
    batch-size: 50
    max-messages-per-run: 2000
  rate-limit:
    sync-per-hour: 12
    fit-checks-per-hour: 30
    llm-calls-per-hour: 300
    uploads-per-hour: 10

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: true

logging:
  level:
    root: INFO
    com.fasttrack: INFO
    # Never log tokens: Spring Security's OAuth debug logging can echo them.
    org.springframework.security.oauth2: WARN
