name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend - tests + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # Integration tests use Testcontainers for PostgreSQL and Redis, and
      # WireMock for Gmail and the LLM. The ubuntu runner ships with Docker.
      - name: Build, test and enforce 80% line coverage
        working-directory: backend
        run: mvn -B verify

      - name: Coverage summary
        if: always()
        run: python3 scripts/coverage_summary.py || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco

  evaluation:
    name: Evaluation harnesses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # The classifier, matcher and fit-scorer evaluations run without an API
      # key, measuring the deterministic paths. They fail the build if quality
      # regresses below the thresholds recorded in RESULTS.md.
      - name: Regenerate the evaluation sets
        run: |
          python3 scripts/generate_eval_set.py
          python3 scripts/generate_matcher_pairs.py
          python3 scripts/generate_fit_pairs.py

      - name: Check the committed sets match the generators
        run: git diff --exit-code eval/

      - name: Run the evaluations
        working-directory: backend
        run: mvn -B -Peval test

      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: eval/results

  frontend:
    name: Frontend - typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: End-to-end (Playwright against the real stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start the stack
        run: |
          cp .env.example .env
          echo "TOKEN_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> .env
          docker compose up -d --build

      - name: Wait for the API and the frontend
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null \
               && curl -sf http://localhost:3000/ > /dev/null; then
              echo "stack is up"; exit 0
            fi
            sleep 5
          done
          echo "stack did not come up in time"; docker compose logs --tail=100; exit 1

      - name: Install Playwright
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npm run test:e2e

      - name: Collect stack logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
